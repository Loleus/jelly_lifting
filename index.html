    .logo {

    }

    #loader {
      position: fixed;
      inset: 0;
      background: #071018;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #8bf;
      font-family: "Freckle Face", sans-serif;
      font-size: 20px;
    }

    .loader-text {
      margin-top: 1rem;
      font-family: "Yarin", sans-serif;
      font-size: 2.3rem;
      color: #8bf;
      text-shadow: 0 0 5px #8bf, 0 0 20px #8bf, 0 0 30px #8bf, 0 0 40px #8bf;

    }

    .spinner {
      position: relative;
      width: 6em;
      height: 6em;
    }

    .spinner:before,
    .spinner:after {
      top: 50%;
      left: 50%;
      box-sizing: border-box;
      content: '';
      position: absolute;
      margin-top: -3em;
      margin-left: -3em;
      width: 6em;
      height: 6em;
      background-size: 6em 6em;
      background-image: url("data:image/svg+xml;utf8,%3Csvg width='266px' height='297px' viewBox='0 0 266 297' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M171.507813,3.25000038 C226.208183,12.8577111 297.112722,71.4912823 250.895599,108.410155 C216.582024,135.82031 186.528405,97.0624964 156.800774,85.7734346 C127.073143,74.4843721 76.8884632,84.2161462 60.1289065,108.410153 C-15.9804685,218.281247 145.277344,296.667968 145.277344,296.667968 C145.277344,296.667968 -25.4492187,257.242198 3.3984375,108.410155 C16.3070661,41.8114174 84.7275829,-11.9922985 171.507813,3.25000038 Z' fill='%2380b0f0'/%3E%3C/svg%3E");
      filter: drop-shadow(0 0 5px #8bf) drop-shadow(0 0 10px #8bf) drop-shadow(0 0 15px #8bf) drop-shadow(0 0 20px #8bf);
    }

    .spinner:before {
      transform: rotateX(60deg) rotateY(45deg) rotateZ(0deg);
      animation: 1.36s rotateBefore infinite linear;
    }

    .spinner:after {
      transform: rotateX(240deg) rotateY(45deg) rotateZ(0deg);
      animation: 1.36s rotateAfter infinite linear;
    }

    @keyframes rotateBefore {
      to {
        transform: rotateX(60deg) rotateY(45deg) rotateZ(360deg);
      }
    }

    @keyframes rotateAfter {
      to {
        transform: rotateX(240deg) rotateY(45deg) rotateZ(360deg);
      }
    }
